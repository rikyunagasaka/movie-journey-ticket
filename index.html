<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MOVIE JOURNEY 入場受付</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background: #fff4f8;

  color: #333;

}

.header {

  background:
    linear-gradient(
      135deg,
      #ed6aa3,
      #e94f91
    );

  color: white;

  text-align: center;

  padding:
    55px
    20px
    48px;

}

.school {

  font-size: 22px;

  margin-bottom: 22px;

  letter-spacing: 1px;

}

.title {

  font-size: 48px;

  font-weight: 800;

  letter-spacing: 1px;

  margin-bottom: 18px;

}

.live {

  font-size: 25px;

}

.container {

  max-width: 760px;

  margin: 40px auto;

  padding: 0 20px;

}

.card {

  background: white;

  border-radius: 32px;

  padding: 45px 30px 40px;

  box-shadow:
    0 10px 35px
    rgba(180, 80, 120, 0.12);

  text-align: center;

}

h1 {

  font-size: 42px;

  margin:
    0
    0
    35px;

}

.description {

  font-size: 20px;

  line-height: 1.9;

  color: #666;

  margin-bottom: 35px;

}

button {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 22px;

  font-size: 24px;

  font-weight: 700;

  cursor: pointer;

}

#startButton {

  background: #e95791;

  color: white;

  margin-bottom: 25px;

}

#startButton:active {

  transform: scale(0.98);

}

#reader {

  width: 100%;

  max-width: 520px;

  margin: 20px auto;

  overflow: hidden;

  border-radius: 20px;

}

.status {

  font-size: 20px;

  color: #666;

  margin:
    20px
    0;

}

.result {

  display: none;

  margin-top: 30px;

  padding: 35px 25px;

  border-radius: 28px;

}

.result.success {

  display: block;

  background: #fff0f6;

  border:
    4px solid
    #e95791;

}

.result.warning {

  display: block;

  background: #fff8e8;

  border:
    4px solid
    #e5a72d;

}

.result.error {

  display: block;

  background: #fff0f0;

  border:
    4px solid
    #d64535;

}

.result-icon {

  font-size: 65px;

  font-weight: 800;

  margin-bottom: 10px;

}

.result-title {

  font-size: 40px;

  font-weight: 800;

  margin-bottom: 25px;

}

.info {

  font-size: 21px;

  line-height: 2;

  text-align: left;

  max-width: 440px;

  margin: auto;

}

.info strong {

  font-size: 26px;

}

#nextButton {

  margin-top: 30px;

  background: #333;

  color: white;

}

.footer {

  text-align: center;

  color: #999;

  font-size: 18px;

  line-height: 1.8;

  padding:
    10px
    20px
    60px;

}

.camera-note {

  font-size: 16px;

  color: #999;

  margin-top: 15px;

}

@media (max-width: 600px) {

  .header {

    padding:
      45px
      15px
      40px;

  }

  .school {

    font-size: 19px;

  }

  .title {

    font-size: 38px;

  }

  .live {

    font-size: 20px;

  }

  .card {

    padding:
      35px
      20px;

    border-radius: 26px;

  }

  h1 {

    font-size: 34px;

  }

  .description {

    font-size: 18px;

  }

  button {

    font-size: 21px;

  }

}

</style>

</head>


<body>


<div class="header">

  <div class="school">
    NSM学園祭2026
  </div>

  <div class="title">
    MOVIE JOURNEY
  </div>

  <div class="live">
    SO.ON project NAGOYA ライブ
  </div>

</div>


<div class="container">


<div class="card">


<h1>
  入場受付
</h1>


<div class="description">

  チケットのQRコードを読み取ってください。<br>

  読み取り後、自動的に入場処理を行います。

</div>


<button
  id="startButton"
  onclick="startCamera()"
>

  カメラを起動する

</button>


<div
  id="status"
  class="status"
>

  カメラを起動してください。

</div>


<div
  id="reader"
></div>


<div
  class="camera-note"
>

  QRコードを読み取る際は、チケット画面をカメラに向けてください。

</div>


<div
  id="result"
  class="result"
>

  <div
    id="resultIcon"
    class="result-icon"
  ></div>

  <div
    id="resultTitle"
    class="result-title"
  ></div>

  <div
    id="resultInfo"
    class="info"
  ></div>

  <button
    id="nextButton"
    onclick="nextTicket()"
  >

    もう一度読み取る

  </button>

</div>


</div>


</div>


<div class="footer">

  名古屋スクールオブミュージック＆ダンス専門学校<br>

  nsm_event@edu.nsm.ac.jp

</div>



<script>


/* ========================================
   Google Apps Script
   ======================================== */

const API_URL =
  "https://script.google.com/a/macros/edu.nsm.ac.jp/s/AKfycbwIo7q50x_TX1baEnBwEDEp51rn1PR0UP0Q5ILdHD1z6kUCQadIMNH4Hl1p7t_1ZpxhhA/exec";



/* ========================================
   変数
   ======================================== */

let scanner = null;

let scanning = false;



/* ========================================
   カメラ起動
   ======================================== */

async function startCamera() {

  const status =
    document.getElementById("status");

  const startButton =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");


  try {

    result.className =
      "result";

    result.style.display =
      "none";


    status.textContent =
      "外カメラを起動しています…";


    startButton.disabled =
      true;


    /*
     * 前回のカメラが残っていた場合
     */

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {}

      scanner = null;

    }


    /*
     * 新しいQRリーダー
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * 外カメラを指定
     *
     * environment = 背面カメラ
     */

    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      },

      aspectRatio: 1.0,

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]

    };


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        /*
         * QRコードをまだ
         * 読み取れていないとき
         *
         * 何もしない
         */

      }

    );


    scanning = true;


    status.textContent =
      "QRコードを読み取ってください。";


    startButton.textContent =
      "外カメラ起動中";


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    /*
     * exact environment が
     * iPhone側で通らない場合の
     * 予備処理
     */

    try {

      if (scanner) {

        try {

          await scanner.stop();

        } catch (e) {}

      }


      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 280,
          height: 280
        },

        aspectRatio: 1.0

      };


      await scanner.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        function() {}

      );


      scanning = true;


      status.textContent =
        "外カメラでQRコードを読み取ってください。";


      startButton.textContent =
        "外カメラ起動中";


      startButton.disabled =
        false;


      return;


    } catch (secondError) {

      console.error(
        "Camera fallback error:",
        secondError
      );


      status.textContent =
        "カメラを起動できませんでした。";


      startButton.textContent =
        "カメラを起動する";


      startButton.disabled =
        false;


      alert(
        "外カメラを起動できませんでした。\n\n" +
        "iPhoneの設定で、このサイトのカメラ使用を許可してください。"
      );

    }

  }

}



/* ========================================
   QR読み取り成功
   ======================================== */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  /*
   * 連続読み取り防止
   */

  if (!scanning) {

    return;

  }


  scanning = false;


  /*
   * カメラ停止
   */

  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {

      console.log(e);

    }

  }


  document.getElementById(
    "status"
  ).textContent =
    "チケットを確認しています…";


  /*
   * QRコードの中身
   *
   * 今回は
   * TKT-XXXXXXXXXXXX
   */

  const ticketId =
    String(decodedText).trim();


  /*
   * Apps Scriptへ送る
   *
   * JSONP方式
   */

  checkTicket(ticketId);

}



/* ========================================
   チケット確認
   ======================================== */

function checkTicket(ticketId) {


  const callbackName =
    "ticketCallback_" +
    Date.now();


  /*
   * Apps Scriptから
   * 結果が返ってきたとき
   */

  window[callbackName] =
    function(data) {


      showResult(data);


      /*
       * 後片付け
       */

      delete window[
        callbackName
      ];


      const oldScript =
        document.getElementById(
          "ticketApiScript"
        );


      if (oldScript) {

        oldScript.remove();

      }

    };


  /*
   * JSONP用scriptタグ
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    "ticketApiScript";


  script.src =
    API_URL +
    "?ticketId=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  /*
   * 通信エラー
   */

  script.onerror =
    function() {


      showResult({

        success: false,

        type: "error",

        message:
          "受付処理に失敗しました。"

      });


      delete window[
        callbackName
      ];


      script.remove();

    };


  document.body.appendChild(
    script
  );

}



/* ========================================
   結果表示
   ======================================== */

function showResult(data) {


  const result =
    document.getElementById(
      "result"
    );


  const icon =
    document.getElementById(
      "resultIcon"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  const info =
    document.getElementById(
      "resultInfo"
    );


  const status =
    document.getElementById(
      "status"
    );


  /*
   * 入場OK
   */

  if (
    data &&
    data.type === "success"
  ) {


    result.className =
      "result success";


    result.style.display =
      "block";


    icon.textContent =
      "OK";


    title.textContent =
      "入場OK";


    info.innerHTML =

      "整理番号<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.reservationNumber || ""
        )
      ) +
      "</strong><br><br>" +

      "お名前<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.name || ""
        )
      ) +
      "</strong><br><br>" +

      "入場時間<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.entryTime || ""
        )
      ) +
      "</strong>";


    status.textContent =
      "入場処理が完了しました。";


    playSound(
      "success"
    );


    return;

  }



  /*
   * すでに入場済み
   */

  if (
    data &&
    data.type === "already"
  ) {


    result.className =
      "result warning";


    result.style.display =
      "block";


    icon.textContent =
      "!";


    title.textContent =
      "入場済み";


    info.innerHTML =

      "整理番号<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.reservationNumber || ""
        )
      ) +
      "</strong><br><br>" +

      "お名前<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.name || ""
        )
      ) +
      "</strong><br><br>" +

      "入場時間<br>" +

      "<strong>" +
      escapeHtml(
        String(
          data.entryTime || ""
        )
      ) +
      "</strong>";


    status.textContent =
      "このチケットはすでに使用されています。";


    playSound(
      "warning"
    );


    return;

  }



  /*
   * 無効なチケット
   */

  if (
    data &&
    data.type === "invalid"
  ) {


    result.className =
      "result error";


    result.style.display =
      "block";


    icon.textContent =
      "!";


    title.textContent =
      "チケット無効";


    info.innerHTML =

      "有効なチケットが見つかりません。";


    status.textContent =
      "受付処理に失敗しました。";


    playSound(
      "error"
    );


    return;

  }



  /*
   * その他のエラー
   */

  result.className =
    "result error";


  result.style.display =
    "block";


  icon.textContent =
    "!";


  title.textContent =
    "受付エラー";


  info.innerHTML =

    escapeHtml(
      String(
        data &&
        data.message
          ? data.message
          : "受付処理に失敗しました。"
      )
    );


  status.textContent =
    "受付処理に失敗しました。";


  playSound(
    "error"
  );

}



/* ========================================
   次のチケット
   ======================================== */

async function nextTicket() {


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result";


  result.style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    "カメラを起動しています…";


  await startCamera();

}



/* ========================================
   HTMLエスケープ
   ======================================== */

function escapeHtml(text) {


  return text

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ========================================
   効果音
   ======================================== */

function playSound(type) {


  try {


    const context =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    if (
      type === "success"
    ) {

      oscillator.frequency.value =
        880;

    } else if (
      type === "warning"
    ) {

      oscillator.frequency.value =
        440;

    } else {

      oscillator.frequency.value =
        220;

    }


    gain.gain.setValueAtTime(
      0.15,
      context.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      context.currentTime + 0.3
    );


    oscillator.start();


    oscillator.stop(
      context.currentTime + 0.3
    );


  } catch (e) {

    /*
     * 音が出せなくても
     * 入場処理には影響させない
     */

  }

}


</script>


</body>

</html>
