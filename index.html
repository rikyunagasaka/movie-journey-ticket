<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MOVIE JOURNEY 入場受付</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background: #fff4f8;

  color: #333;
}


header {

  background:
    linear-gradient(
      135deg,
      #ef79a9,
      #e95691
    );

  color: white;

  text-align: center;

  padding:
    55px 20px 45px;
}


header .school {

  font-size: 18px;

  margin-bottom: 18px;

  letter-spacing: 1px;
}


header h1 {

  margin: 0;

  font-size: 42px;

  font-weight: 800;

  letter-spacing: 1px;
}


header .live {

  margin-top: 18px;

  font-size: 20px;
}


.container {

  max-width: 760px;

  margin: 40px auto;

  padding: 0 18px;
}


.card {

  background: white;

  border-radius: 30px;

  padding: 38px 24px;

  box-shadow:
    0 10px 35px
    rgba(220, 80, 130, 0.12);

  text-align: center;
}


h2 {

  margin-top: 0;

  font-size: 34px;
}


.description {

  color: #777;

  font-size: 18px;

  line-height: 1.8;

  margin-bottom: 30px;
}


button {

  width: 100%;

  border: none;

  border-radius: 18px;

  padding: 20px;

  font-size: 21px;

  font-weight: bold;

  cursor: pointer;
}


#startButton {

  background: #e95791;

  color: white;
}


#reader {

  width: 100%;

  max-width: 500px;

  margin: 25px auto;

  overflow: hidden;

  border-radius: 20px;
}


.status {

  margin-top: 20px;

  font-size: 18px;

  color: #777;
}


.result {

  margin-top: 25px;

  padding: 35px 20px;

  border-radius: 25px;

  display: none;
}


.result.success {

  display: block;

  background: #fff0f7;

  border: 4px solid #e95791;
}


.result.warning {

  display: block;

  background: #fff9e8;

  border: 4px solid #e0a500;
}


.result.error {

  display: block;

  background: #fff0f0;

  border: 4px solid #d54a3a;
}


.result-icon {

  font-size: 55px;

  font-weight: bold;

  margin-bottom: 10px;
}


.result h3 {

  font-size: 36px;

  margin: 10px 0 25px;
}


.info {

  font-size: 20px;

  line-height: 2;

  margin-bottom: 25px;
}


.next {

  background: #333;

  color: white;
}


footer {

  text-align: center;

  color: #999;

  padding: 30px 20px 60px;

  font-size: 16px;

  line-height: 1.8;
}

</style>

</head>


<body>


<header>

<div class="school">
NSM学園祭2026
</div>

<h1>
MOVIE JOURNEY
</h1>

<div class="live">
SO.ON project NAGOYA ライブ
</div>

</header>


<div class="container">


<div class="card">

<h2>
入場受付
</h2>

<div class="description">

チケットのQRコードを<br>
読み取ってください。<br>

読み取り後、自動的に入場処理を行います。

</div>


<button
  id="startButton"
  onclick="startCamera()"
>
カメラを起動する
</button>


<div
  id="reader"
  style="display:none;"
></div>


<div
  id="status"
  class="status"
>
カメラを起動してください。
</div>


<div
  id="result"
  class="result"
>

<div
  id="resultIcon"
  class="result-icon"
></div>

<h3 id="resultTitle"></h3>

<div
  id="resultInfo"
  class="info"
></div>

<button
  class="next"
  onclick="nextTicket()"
>
もう一度読み取る
</button>

</div>

</div>

</div>


<footer>

名古屋スクールオブミュージック＆ダンス専門学校<br>

nsm_event@edu.nsm.ac.jp

</footer>


<script>


/* =========================
   Apps Script URL
========================= */

const API_URL =
"https://script.google.com/a/macros/edu.nsm.ac.jp/s/AKfycbwIo7q50x_TX1baEnBwEDEp51rn1PR0UP0Q5ILdHD1z6kUCQadIMNH4Hl1p7t_1ZpxhhA/exec";


let scanner = null;

let scanning = false;


/* =========================
   カメラ起動
========================= */

async function startCamera() {

  if (scanning) {
    return;
  }

  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "reader"
  ).style.display = "block";


  document.getElementById(
    "status"
  ).textContent =
    "カメラを起動しています…";


  scanner =
    new Html5Qrcode("reader");


  try {

    /*
      外カメラを優先
    */

    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 280
        }
      },

      onScanSuccess,

      onScanFailure

    );

    scanning = true;

    document.getElementById(
      "status"
    ).textContent =
      "チケットのQRコードを読み取ってください。";


  } catch (error) {

    console.error(error);

    /*
      exact environment が使えない端末用
      → 外カメラを優先して探す
    */

    try {

      const cameras =
        await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {

        throw new Error(
          "カメラが見つかりません。"
        );

      }


      let cameraId =
        cameras[cameras.length - 1].id;


      for (const camera of cameras) {

        const label =
          (camera.label || "").toLowerCase();

        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment") ||
          label.includes("外")
        ) {

          cameraId = camera.id;

          break;

        }

      }


      await scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 280
          }
        },

        onScanSuccess,

        onScanFailure

      );


      scanning = true;

      document.getElementById(
        "status"
      ).textContent =
        "チケットのQRコードを読み取ってください。";


    } catch (error2) {

      console.error(error2);

      document.getElementById(
        "status"
      ).textContent =
        "カメラを起動できませんでした。外カメラの使用を許可してください。";

      document.getElementById(
        "startButton"
      ).style.display = "block";

    }

  }

}


/* =========================
   QR読み取り成功
========================= */

async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;


  try {

    await scanner.stop();

  } catch (e) {}


  document.getElementById(
    "status"
  ).textContent =
    "チケットを確認しています…";


  const ticketId =
    String(decodedText).trim();


  /*
    JSONP方式でApps Scriptへ送信
  */

  const callbackName =
    "ticketCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        showResult(data);

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?ticketId=" +
    encodeURIComponent(ticketId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      showResult({

        success: false,

        type: "error",

        message:
          "受付処理に接続できませんでした。"

      });

    };


  document.body.appendChild(script);

}


/* =========================
   QR読み取り中のエラー
========================= */

function onScanFailure(error) {

  // 読み取り失敗は通常なので何もしない

}


/* =========================
   結果表示
========================= */

function showResult(data) {

  const result =
    document.getElementById("result");

  const icon =
    document.getElementById("resultIcon");

  const title =
    document.getElementById("resultTitle");

  const info =
    document.getElementById("resultInfo");


  result.className = "result";


  if (
    data &&
    data.type === "success"
  ) {

    result.classList.add("success");

    icon.textContent = "✓";

    title.textContent =
      "入場OK";


    info.innerHTML =

      "整理番号：<strong>" +
      escapeHtml(
        data.reservationNumber
      ) +
      "</strong><br>" +

      "氏名：" +
      escapeHtml(
        data.name || ""
      ) +
      "<br>" +

      "入場時間：" +
      escapeHtml(
        data.entryTime || ""
      );


  } else if (
    data &&
    data.type === "already"
  ) {

    result.classList.add("warning");

    icon.textContent = "!";

    title.textContent =
      "入場済み";


    info.innerHTML =

      "このチケットはすでに入場済みです。<br><br>" +

      "整理番号：" +
      escapeHtml(
        data.reservationNumber
      ) +
      "<br>" +

      "氏名：" +
      escapeHtml(
        data.name || ""
      ) +
      "<br>" +

      "入場時間：" +
      escapeHtml(
        data.entryTime || ""
      );


  } else {

    result.classList.add("error");

    icon.textContent = "!";

    title.textContent =
      "受付エラー";


    info.innerHTML =
      escapeHtml(
        data && data.message
          ? data.message
          : "受付処理に失敗しました。"
      );

  }


  result.style.display = "block";

}


/* =========================
   もう一度読み取る
========================= */

async function nextTicket() {

  const result =
    document.getElementById("result");

  result.style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    "カメラを起動しています…";


  await startCamera();

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
