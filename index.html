<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>MOVIE JOURNEY 入場受付</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  min-height: 100svh;
}

.app {
  width: 100%;
  height: 100svh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: #111;
}

/* =========================
   ヘッダー
========================= */

.header {
  flex: 0 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    18px
    10px;

  border-bottom: 1px solid #333;
  background: #151515;
}

.header-small {
  font-size: 11px;
  letter-spacing: 2px;
  color: #888;
  margin-bottom: 3px;
}

.header-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}

.header-sub {
  font-size: 12px;
  color: #999;
  margin-top: 2px;
}

/* =========================
   メイン
========================= */

.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px;
}

/* =========================
   状態
========================= */

.status {
  flex: 0 0 auto;
  text-align: center;
  padding: 6px 10px;
  font-size: 14px;
  color: #aaa;
}

.status.ready {
  color: #fff;
}

.status.scanning {
  color: #7dd3fc;
}

.status.success {
  color: #4ade80;
}

.status.warning {
  color: #facc15;
}

.status.error {
  color: #f87171;
}

/* =========================
   QRエリア
========================= */

.scanner-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#reader {
  width: 100%;
  max-width: 500px;
  height: 100%;
  max-height: 65vh;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  border: 1px solid #333;
}

/* html5-qrcode内 */
#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#reader img {
  display: none !important;
}

/* =========================
   下部操作
========================= */

.controls {
  flex: 0 0 auto;
  padding-top: 10px;
}

button {
  width: 100%;
  height: 54px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.start-button {
  background: #fff;
  color: #111;
}

.start-button:active {
  transform: scale(0.98);
}

.stop-button {
  background: #2a2a2a;
  color: #fff;
  margin-top: 8px;
}

/* =========================
   結果
========================= */

.result {
  position: absolute;
  inset: 0;
  z-index: 20;

  display: none;
  align-items: center;
  justify-content: center;

  padding:
    calc(env(safe-area-inset-top) + 20px)
    18px
    calc(env(safe-area-inset-bottom) + 20px);

  background: rgba(10, 10, 10, 0.96);
}

.result.show {
  display: flex;
}

.result-card {
  width: 100%;
  max-width: 500px;
  border-radius: 22px;
  padding: 28px 22px;
  text-align: center;
  background: #181818;
  border: 1px solid #333;
}

.result-icon {
  font-size: 58px;
  line-height: 1;
  margin-bottom: 14px;
}

.result-title {
  font-size: 34px;
  font-weight: 900;
  margin-bottom: 18px;
}

.result-message {
  font-size: 16px;
  color: #bbb;
  margin-bottom: 22px;
}

.result-info {
  text-align: left;
  background: #111;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #292929;
}

.info-row:last-child {
  border-bottom: 0;
}

.info-label {
  color: #777;
  font-size: 13px;
}

.info-value {
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  text-align: right;
}

.next-button {
  background: #fff;
  color: #111;
}

/* =========================
   初期状態
========================= */

.start-screen {
  position: absolute;
  inset: 0;
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    calc(env(safe-area-inset-top) + 20px)
    20px
    calc(env(safe-area-inset-bottom) + 20px);

  background: #111;
}

.start-card {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.start-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 10px;
}

.start-description {
  color: #999;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 28px;
}

.start-button-large {
  height: 60px;
  background: #fff;
  color: #111;
  border-radius: 14px;
  font-size: 17px;
}

/* =========================
   小さい画面
========================= */

@media (max-height: 700px) {

  .header-title {
    font-size: 19px;
  }

  .header-sub {
    font-size: 11px;
  }

  .main {
    padding: 8px;
  }

  .status {
    padding: 3px;
    font-size: 12px;
  }

  #reader {
    max-height: 62vh;
  }

  button {
    height: 48px;
  }

}

</style>

</head>


<body>

<div class="app">

  <header class="header">

    <div class="header-small">
      NSM学園祭2026
    </div>

    <div class="header-title">
      MOVIE JOURNEY
    </div>

    <div class="header-sub">
      SO.ON project NAGOYA ライブ　入場受付
    </div>

  </header>


  <main class="main">

    <div
      id="status"
      class="status ready"
    >
      QRコードを読み取る準備をしています
    </div>


    <div class="scanner-wrap">

      <div id="reader"></div>

    </div>


    <div class="controls">

      <button
        id="startButton"
        class="start-button"
        onclick="startCamera()"
      >
        カメラを起動
      </button>

      <button
        id="stopButton"
        class="stop-button"
        onclick="stopCamera()"
        style="display:none;"
      >
        カメラを停止
      </button>

    </div>

  </main>

</div>


<!-- =========================
     初期画面
========================= -->

<div
  id="startScreen"
  class="start-screen"
>

  <div class="start-card">

    <div class="start-title">
      入場受付
    </div>

    <div class="start-description">
      チケットのQRコードを読み取ります。<br>
      カメラを起動して、チケット画面を<br>
      カメラに向けてください。
    </div>

    <button
      class="start-button-large"
      onclick="startCamera()"
    >
      カメラを起動する
    </button>

  </div>

</div>


<!-- =========================
     結果画面
========================= -->

<div
  id="result"
  class="result"
>

  <div class="result-card">

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>

    <div
      id="resultTitle"
      class="result-title"
    >
      入場OK
    </div>

    <div
      id="resultMessage"
      class="result-message"
    >
      入場処理が完了しました。
    </div>

    <div
      id="resultInfo"
      class="result-info"
    ></div>

    <button
      class="next-button"
      onclick="nextTicket()"
    >
      次のチケットを読み取る
    </button>

  </div>

</div>


<script>

/* ========================================
   Google Apps Script
======================================== */

const API_URL =
  "https://script.google.com/a/macros/edu.nsm.ac.jp/s/AKfycbwIo7q50x_TX1baEnBwEDEp51rn1PR0UP0Q5ILdHD1z6kUCQadIMNH4Hl1p7t_1ZpxhhA/exec";


let scanner = null;

let scanning = false;

let processing = false;


/* ========================================
   表示
======================================== */

function setStatus(
  text,
  type = "ready"
) {

  const el =
    document.getElementById("status");

  el.textContent = text;

  el.className =
    "status " + type;

}


/* ========================================
   カメラ開始
======================================== */

async function startCamera() {

  if (scanning) {
    return;
  }

  try {

    setStatus(
      "カメラを起動しています…",
      "scanning"
    );

    document
      .getElementById("startScreen")
      .style.display = "none";

    document
      .getElementById("startButton")
      .style.display = "none";

    scanner =
      new Html5Qrcode("reader");


    /* =========================
       カメラ一覧取得
    ========================= */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "カメラが見つかりません。"
      );

    }


    /*
      外カメラを優先

      iPhoneでは
      Back Camera
      Rear Camera
      Environment
      などの名前になる
    */

    let selectedCamera =
      cameras.find(camera => {

        const label =
          String(
            camera.label || ""
          ).toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      });


    /*
      外カメラが見つからない場合
      cameraIdではなく
      facingModeで外カメラを指定
    */

    if (!selectedCamera) {

      await scanner.start(

        {
          facingMode: {
            exact: "environment"
          }
        },

        {
          fps: 10,

          qrbox: function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height,
                280
              );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        },

        onScanSuccess,

        onScanFailure

      );

    } else {

      await scanner.start(

        selectedCamera.id,

        {
          fps: 10,

          qrbox: function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height,
                280
              );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        },

        onScanSuccess,

        onScanFailure

      );

    }


    scanning = true;

    document
      .getElementById("stopButton")
      .style.display = "block";

    setStatus(
      "QRコードを読み取ってください",
      "scanning"
    );


  } catch (error) {

    console.error(error);

    scanning = false;

    document
      .getElementById("startScreen")
      .style.display = "flex";

    document
      .getElementById("startButton")
      .style.display = "block";

    setStatus(
      "カメラを起動できませんでした",
      "error"
    );

    alert(
      "カメラを起動できませんでした。\n\n" +
      "iPhoneの設定でカメラの使用を許可してください。"
    );

  }

}


/* ========================================
   QR読み取り
======================================== */

async function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }

  processing = true;

  console.log(
    "QR:",
    decodedText
  );


  await stopCamera();


  setStatus(
    "チケットを確認しています…",
    "scanning"
  );


  /*
    QRには
    TKT-XXXXXXXXXXXXXXX
    のようなチケットIDだけが入っている
  */

  const ticketId =
    String(
      decodedText
    ).trim();


  requestTicket(
    ticketId
  );

}


/* ========================================
   QR読み取り中
======================================== */

function onScanFailure(
  error
) {

  // 読み取り失敗は通常なので
  // 画面には表示しない

}


/* ========================================
   Apps Scriptへ接続
   JSONP方式
======================================== */

function requestTicket(
  ticketId
) {

  const callbackName =
    "ticketCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  /*
    タイムアウト
  */

  const timeout =
    setTimeout(
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        showConnectionError();

      },
      10000
    );


  /*
    JSONP callback
  */

  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();

      console.log(
        "Apps Script response:",
        data
      );

      handleResult(data);

    };


  /*
    scriptタグでアクセス
    CORSを回避する
  */

  const url =
    API_URL +
    "?ticketId=" +
    encodeURIComponent(ticketId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.src = url;

  script.async = true;


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();

      showConnectionError();

    };


  document
    .body
    .appendChild(script);


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


/* ========================================
   結果処理
======================================== */

function handleResult(
  data
) {

  if (!data) {

    showConnectionError();

    return;

  }


  if (
    data.type === "success" &&
    data.success === true
  ) {

    showSuccess(data);

    return;

  }


  if (
    data.type === "already"
  ) {

    showAlready(data);

    return;

  }


  if (
    data.type === "invalid"
  ) {

    showInvalid(data);

    return;

  }


  showError(
    data.message ||
    "受付処理に失敗しました。"
  );

}


/* ========================================
   入場OK
======================================== */

function showSuccess(
  data
) {

  document
    .getElementById("resultIcon")
    .textContent = "✓";

  document
    .getElementById("resultTitle")
    .textContent = "入場OK";

  document
    .getElementById("resultTitle")
    .style.color = "#4ade80";

  document
    .getElementById("resultMessage")
    .textContent =
      "入場処理が完了しました。";


  document
    .getElementById("resultInfo")
    .innerHTML =

      infoRow(
        "整理番号",
        data.reservationNumber
      ) +

      infoRow(
        "名前",
        data.name
      ) +

      infoRow(
        "入場時間",
        data.entryTime
      );


  document
    .getElementById("result")
    .classList.add("show");

}


/* ========================================
   二重入場
======================================== */

function showAlready(
  data
) {

  document
    .getElementById("resultIcon")
    .textContent = "!";

  document
    .getElementById("resultTitle")
    .textContent = "入場済み";

  document
    .getElementById("resultTitle")
    .style.color = "#facc15";

  document
    .getElementById("resultMessage")
    .textContent =
      "このチケットはすでに使用されています。";


  document
    .getElementById("resultInfo")
    .innerHTML =

      infoRow(
        "整理番号",
        data.reservationNumber
      ) +

      infoRow(
        "名前",
        data.name
      ) +

      infoRow(
        "入場時間",
        data.entryTime
      );


  document
    .getElementById("result")
    .classList.add("show");

}


/* ========================================
   無効
======================================== */

function showInvalid(
  data
) {

  document
    .getElementById("resultIcon")
    .textContent = "!";

  document
    .getElementById("resultTitle")
    .textContent = "チケット無効";

  document
    .getElementById("resultTitle")
    .style.color = "#f87171";

  document
    .getElementById("resultMessage")
    .textContent =
      "有効なチケットが見つかりません。";


  document
    .getElementById("resultInfo")
    .innerHTML = "";


  document
    .getElementById("result")
    .classList.add("show");

}


/* ========================================
   その他エラー
======================================== */

function showError(
  message
) {

  document
    .getElementById("resultIcon")
    .textContent = "!";

  document
    .getElementById("resultTitle")
    .textContent = "受付エラー";

  document
    .getElementById("resultTitle")
    .style.color = "#f87171";

  document
    .getElementById("resultMessage")
    .textContent =
      message;


  document
    .getElementById("resultInfo")
    .innerHTML = "";


  document
    .getElementById("result")
    .classList.add("show");

}


/* ========================================
   接続エラー
======================================== */

function showConnectionError() {

  showError(
    "Apps Scriptに接続できませんでした。"
  );

}


/* ========================================
   情報行
======================================== */

function infoRow(
  label,
  value
) {

  return `
    <div class="info-row">

      <span class="info-label">
        ${escapeHtml(label)}
      </span>

      <span class="info-value">
        ${escapeHtml(
          value == null
            ? ""
            : String(value)
        )}
      </span>

    </div>
  `;

}


/* ========================================
   HTMLエスケープ
======================================== */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ========================================
   カメラ停止
======================================== */

async function stopCamera() {

  if (
    scanner &&
    scanning
  ) {

    try {

      await scanner.stop();

    } catch (e) {

      console.log(e);

    }

  }

  scanning = false;

  document
    .getElementById("stopButton")
    .style.display = "none";

}


/* ========================================
   次のチケット
======================================== */

async function nextTicket() {

  processing = false;

  document
    .getElementById("result")
    .classList.remove("show");

  setStatus(
    "次のチケットを読み取る準備をしています…",
    "ready"
  );

  await startCamera();

}

</script>

</body>

</html>
