<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>MOVIE JOURNEY 入場受付</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background: #fff4f8;

  color: #333;

}


/* =========================
   ヘッダー
========================= */

header {

  height: 18vh;

  min-height: 125px;

  max-height: 180px;

  background:
    linear-gradient(
      135deg,
      #ef79a9,
      #e95791
    );

  color: white;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  padding:
    env(safe-area-inset-top)
    15px
    10px;

}


.school {

  font-size: clamp(
    14px,
    2.5vw,
    19px
  );

  margin-bottom: 4px;

}


header h1 {

  margin: 0;

  font-size: clamp(
    28px,
    7vw,
    48px
  );

  font-weight: 800;

  line-height: 1.05;

}


.live {

  margin-top: 5px;

  font-size: clamp(
    14px,
    3.5vw,
    21px
  );

}


/* =========================
   メイン
========================= */

main {

  height: 82vh;

  height:
    calc(
      100vh - 18vh
    );

  overflow: hidden;

  padding:
    12px
    14px
    max(
      12px,
      env(safe-area-inset-bottom)
    );

}


.card {

  width: 100%;

  height: 100%;

  max-width: 650px;

  margin: 0 auto;

  background: white;

  border-radius: 24px;

  box-shadow:
    0 5px 25px
    rgba(
      220,
      80,
      130,
      0.12
    );

  padding:
    14px;

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* =========================
   タイトル
========================= */

.title {

  font-size: clamp(
    25px,
    6vw,
    35px
  );

  font-weight: 800;

  margin:
    0 0 3px;

}


.description {

  text-align: center;

  color: #777;

  font-size: clamp(
    12px,
    3.2vw,
    17px
  );

  line-height: 1.35;

  margin:
    0 0 8px;

}


/* =========================
   カメラ
========================= */

#reader {

  width: 100%;

  max-width: 520px;

  flex: 1;

  min-height: 0;

  border-radius: 18px;

  overflow: hidden;

  background: #111;

  position: relative;

}


/*
   html5-qrcodeが作る映像を
   できるだけ大きく表示
*/

#reader video {

  width: 100% !important;

  height: 100% !important;

  object-fit: cover !important;

}


#reader__scan_region {

  width: 100% !important;

  height: 100% !important;

}


/* QR枠 */

#reader__scan_region img {

  display: none !important;

}


/* =========================
   起動ボタン
========================= */

#startButton {

  width: 100%;

  max-width: 520px;

  border: 0;

  border-radius: 15px;

  background: #e95791;

  color: white;

  font-size: 20px;

  font-weight: 700;

  padding: 15px;

  margin-top: 7px;

}


#startButton:active {

  transform: scale(0.98);

}


/* =========================
   ステータス
========================= */

#status {

  flex-shrink: 0;

  text-align: center;

  color: #777;

  font-size: 14px;

  line-height: 1.3;

  padding:
    6px 3px;

}


/* =========================
   結果
========================= */

.result {

  display: none;

  position: absolute;

  z-index: 20;

  inset: 0;

  background: rgba(
    255,
    255,
    255,
    0.98
  );

  border-radius: 24px;

  padding:
    30px 20px;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

}


.result.show {

  display: flex;

}


.result.success {

  border:
    6px solid #4caf7a;

}


.result.warning {

  border:
    6px solid #e0a500;

}


.result.error {

  border:
    6px solid #d54a3a;

}


.result-icon {

  font-size: 65px;

  line-height: 1;

  font-weight: 800;

}


.result-title {

  font-size: 40px;

  font-weight: 800;

  margin:
    10px 0 18px;

}


.result-info {

  font-size: 20px;

  line-height: 1.8;

}


.next-button {

  width: 100%;

  max-width: 420px;

  border: 0;

  border-radius: 15px;

  background: #333;

  color: white;

  font-size: 19px;

  font-weight: 700;

  padding: 15px;

  margin-top: 25px;

}


/* =========================
   小さいiPhone
========================= */

@media (
  max-height: 700px
) {

  header {

    height: 16vh;

    min-height: 105px;

  }


  main {

    height: 84vh;

    height:
      calc(
        100vh - 16vh
      );

  }


  .title {

    font-size: 25px;

  }


  .description {

    font-size: 12px;

  }


  #status {

    font-size: 12px;

  }


  .next-button {

    margin-top: 15px;

  }

}

</style>

</head>


<body>


<header>

<div class="school">
NSM学園祭2026
</div>

<h1>
MOVIE JOURNEY
</h1>

<div class="live">
SO.ON project NAGOYA ライブ
</div>

</header>


<main>


<div class="card">


<div class="title">
入場受付
</div>


<div class="description">

チケットのQRコードを<br>
カメラにかざしてください。

</div>


<div
  id="reader"
  style="display:none;"
></div>


<button
  id="startButton"
  onclick="startCamera()"
>
カメラを起動する
</button>


<div id="status">

カメラを起動してください。

</div>


<div
  id="result"
  class="result"
>

<div
  id="resultIcon"
  class="result-icon"
></div>


<div
  id="resultTitle"
  class="result-title"
></div>


<div
  id="resultInfo"
  class="result-info"
></div>


<button
  class="next-button"
  onclick="nextTicket()"
>
もう一度読み取る
</button>


</div>


</div>

</main>


<script>


/* =================================================
   Apps Script URL
================================================= */

const API_URL =
"https://script.google.com/a/macros/edu.nsm.ac.jp/s/AKfycbwIo7q50x_TX1baEnBwEDEp51rn1PR0UP0Q5ILdHD1z6kUCQadIMNH4Hl1p7t_1ZpxhhA/exec";


let scanner = null;

let scanning = false;

let processing = false;


/* =================================================
   カメラ起動
================================================= */

async function startCamera() {

  if (scanning || processing) {
    return;
  }


  const button =
    document.getElementById(
      "startButton"
    );


  const reader =
    document.getElementById(
      "reader"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.style.display =
    "none";


  reader.style.display =
    "block";


  status.textContent =
    "外カメラを起動しています…";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    /*
     * まず外カメラを直接指定
     */

    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height,
              300
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio:
          1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scanning = true;


    status.textContent =
      "チケットのQRコードをかざしてください。";


  } catch (error) {

    console.log(
      "environment指定失敗:",
      error
    );


    /*
     * それでも駄目ならカメラ一覧から
     * 背面カメラを探す
     */

    try {

      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "カメラがありません。"
        );

      }


      let cameraId =
        null;


      /*
       * ラベルから背面カメラを探す
       */

      for (
        const camera of cameras
      ) {

        const label =
          String(
            camera.label || ""
          ).toLowerCase();


        if (

          label.includes(
            "back"
          ) ||

          label.includes(
            "rear"
          ) ||

          label.includes(
            "environment"
          ) ||

          label.includes(
            "外"
          )

        ) {

          cameraId =
            camera.id;

          break;

        }

      }


      /*
       * 見つからなければ最後のカメラ
       */

      if (!cameraId) {

        cameraId =
          cameras[
            cameras.length - 1
          ].id;

      }


      await scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height,
                300
              );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio:
            1.0

        },

        onScanSuccess,

        onScanFailure

      );


      scanning = true;


      status.textContent =
        "チケットのQRコードをかざしてください。";


    } catch (error2) {

      console.error(
        error2
      );


      button.style.display =
        "block";


      reader.style.display =
        "none";


      status.textContent =
        "外カメラを起動できませんでした。カメラの使用を許可してください。";

    }

  }

}


/* =================================================
   QR読み取り
================================================= */

function onScanSuccess(
  decodedText
) {

  if (
    !scanning ||
    processing
  ) {

    return;

  }


  processing = true;

  scanning = false;


  /*
   * カメラ停止
   */

  if (scanner) {

    scanner
      .stop()
      .catch(
        () => {}
      );

  }


  document.getElementById(
    "status"
  ).textContent =
    "チケットを確認しています…";


  const ticketId =
    String(
      decodedText
    ).trim();


  /*
   * JSONP
   */

  const callbackName =
    "movieJourneyCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        showResult(
          data
        );

      } finally {

        delete window[
          callbackName
        ];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {

          script.remove();

        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?ticketId=" +
    encodeURIComponent(
      ticketId
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      script.remove();


      showResult({

        success: false,

        type: "error",

        message:
          "Apps Scriptに接続できませんでした。"

      });

    };


  document.body.appendChild(
    script
  );

}


/* =================================================
   QR読み取り中
================================================= */

function onScanFailure(
  error
) {

  // 通常の読み取り失敗なので表示しない

}


/* =================================================
   結果表示
================================================= */

function showResult(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  const icon =
    document.getElementById(
      "resultIcon"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  const info =
    document.getElementById(
      "resultInfo"
    );


  result.className =
    "result show";


  /*
   * 入場OK
   */

  if (
    data &&
    data.type === "success"
  ) {

    result.classList.add(
      "success"
    );


    icon.textContent =
      "✓";


    title.textContent =
      "入場OK";


    info.innerHTML =

      "整理番号：" +
      "<strong>" +
      escapeHtml(
        data.reservationNumber
      ) +
      "</strong>" +

      "<br>" +

      "氏名：" +
      escapeHtml(
        data.name || ""
      ) +

      "<br>" +

      "入場時間：" +
      escapeHtml(
        data.entryTime || ""
      );


  }


  /*
   * 二重入場
   */

  else if (
    data &&
    data.type === "already"
  ) {

    result.classList.add(
      "warning"
    );


    icon.textContent =
      "!";


    title.textContent =
      "入場済み";


    info.innerHTML =

      "このチケットは<br>" +
      "<strong>すでに入場済み</strong>です。" +

      "<br><br>" +

      "整理番号：" +
      escapeHtml(
        data.reservationNumber
      ) +

      "<br>" +

      "氏名：" +
      escapeHtml(
        data.name || ""
      ) +

      "<br>" +

      "入場時間：" +
      escapeHtml(
        data.entryTime || ""
      );


  }


  /*
   * 無効
   */

  else if (
    data &&
    data.type === "invalid"
  ) {

    result.classList.add(
      "error"
    );


    icon.textContent =
      "!";


    title.textContent =
      "チケット無効";


    info.textContent =
      data.message ||
      "有効なチケットが見つかりません。";


  }


  /*
   * その他のエラー
   */

  else {

    result.classList.add(
      "error"
    );


    icon.textContent =
      "!";


    title.textContent =
      "受付エラー";


    info.textContent =
      data &&
      data.message
        ? data.message
        : "受付処理に失敗しました。";

  }

}


/* =================================================
   次のチケット
================================================= */

async function nextTicket() {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result";


  processing = false;

  scanning = false;


  document.getElementById(
    "status"
  ).textContent =
    "外カメラを起動しています…";


  await startCamera();

}


/* =================================================
   HTMLエスケープ
================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
